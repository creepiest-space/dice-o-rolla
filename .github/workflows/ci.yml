name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Type-aware lint
        run: bun run lint:types

      - name: Dead code
        run: bun run deadcode

      - name: Validate release metadata
        run: bun run version:status

  test:
    needs: [quality, library]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: bun run test:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: ignore
          retention-days: 7

  library:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Package dice-engine library
        run: bun run pack:dice-engine

      - name: Verify npm package contents
        run: bun ./scripts/verify-npm-packages.ts

      - name: Verify local package artifacts
        run: |
          test -f artifacts/release-manifest.json
          version="$(jq -r '.version' artifacts/release-manifest.json)"
          test "$version" != "null"
          test "$(jq '.packages | length' artifacts/release-manifest.json)" -eq 7
          for archive in dice-core dice-engine dice-geometry dice-physics dice-physics-rapier dice-renderer dice-renderer-three; do
            archive_path="artifacts/$archive-$version.tgz"
            test -f "$archive_path"
            tar -tzf "$archive_path" | grep -Fx package/LICENSE
            tar -tzf "$archive_path" | grep -Fx package/NOTICE
            tar -tzf "$archive_path" | grep -Fx package/THIRD_PARTY_NOTICES.md
            tar -tzf "$archive_path" | grep -Fx package/dist/index.js
            tar -tzf "$archive_path" | grep -Fx package/dist/index.d.ts
            ! tar -tzf "$archive_path" | grep -F '/src/'
            tar -xOzf "$archive_path" package/package.json | jq -e --arg version "$version" '.version == $version and .license == "Apache-2.0" and .scripts == null and .devDependencies == null'
            tar -xOzf "$archive_path" package/package.json | jq -e '[(.dependencies // {} | keys[]) | startswith("@dice-o-rolla/")] | any | not'
            ! tar -xOzf "$archive_path" package/package.json | grep -F 'workspace:'
          done
          tar -tzf "artifacts/dice-engine-$version.tgz" | grep -Fx package/LICENSE
          tar -tzf "artifacts/dice-engine-$version.tgz" | grep -Fx package/dist/browser.js
          tar -tzf "artifacts/dice-engine-$version.tgz" | grep -Fx package/dist/browser.d.ts
          test -f artifacts/local-dependencies.json
          test -f artifacts/README.md
          jq -e '(.dependencies | length) == 7 and ([.dependencies[] | startswith("file:./artifacts/")] | all)' artifacts/local-dependencies.json
          jq -e --arg version "$version" '([.packages[].version == $version] | all) and ([.packages[].archive | endswith("-" + $version + ".tgz")] | all)' artifacts/release-manifest.json
          shasum -a 256 -c artifacts/SHA256SUMS

      - name: Verify Bun consumer installation
        run: |
          consumer_directory="$(mktemp -d)"
          cp -R artifacts "$consumer_directory/artifacts"
          cp artifacts/local-dependencies.json "$consumer_directory/package.json"
          cd "$consumer_directory"
          bun install --offline
          bun -e "const core = await import('@dice-o-rolla/dice-engine'); const browser = await import('@dice-o-rolla/dice-engine/browser'); const renderer = await import('@dice-o-rolla/dice-renderer-three'); if (typeof core.DiceEngine !== 'function' || typeof browser.createDefaultDiceEngine !== 'function' || typeof renderer.TopDownDiceRenderer !== 'function') process.exit(1)"

      - name: Verify npm consumer installation
        run: |
          consumer_directory="$(mktemp -d)"
          cp -R artifacts "$consumer_directory/artifacts"
          cp artifacts/local-dependencies.json "$consumer_directory/package.json"
          cd "$consumer_directory"
          npm install --ignore-scripts
          node --input-type=module -e "const core = await import('@dice-o-rolla/dice-engine'); const browser = await import('@dice-o-rolla/dice-engine/browser'); const renderer = await import('@dice-o-rolla/dice-renderer-three'); if (typeof core.DiceEngine !== 'function' || typeof browser.createDefaultDiceEngine !== 'function' || typeof renderer.TopDownDiceRenderer !== 'function') process.exit(1)"
