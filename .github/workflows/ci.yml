name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-aware lint
        run: bun run lint:types

      - name: Typecheck
        run: bun run typecheck

      - name: Dead code
        run: bun run deadcode

  test:
    needs: [quality, library]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  library:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Package dice-engine library
        run: bun run pack:dice-engine

      - name: Verify package archive
        run: |
          test -f artifacts/dice-engine.tgz
          tar -tzf artifacts/dice-engine.tgz | grep -Fx package/LICENSE
          tar -tzf artifacts/dice-engine.tgz | grep -Fx package/NOTICE
          tar -tzf artifacts/dice-engine.tgz | grep -Fx package/THIRD_PARTY_NOTICES.md
          tar -tzf artifacts/dice-engine.tgz | grep -Fx package/dist/index.js
          tar -tzf artifacts/dice-engine.tgz | grep -Fx package/dist/index.d.ts
          tar -tzf artifacts/dice-engine.tgz | grep -Fx package/dist/browser.js
          tar -tzf artifacts/dice-engine.tgz | grep -Fx package/dist/browser.d.ts
          ! tar -tzf artifacts/dice-engine.tgz | grep -F '/src/'
          tar -xOzf artifacts/dice-engine.tgz package/package.json | jq -e '.license == "Apache-2.0" and .scripts == null'
          ! tar -xOzf artifacts/dice-engine.tgz package/package.json | grep -F 'workspace:'
          shasum -a 256 artifacts/dice-engine.tgz
