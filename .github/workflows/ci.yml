name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-aware lint
        run: bun run lint:types

      - name: Typecheck
        run: bun run typecheck

      - name: Dead code
        run: bun run deadcode

  test:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
