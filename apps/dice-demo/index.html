<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A physical polyhedral dice engine demo." />
    <title>Dice O Rolla</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Physical dice engine</p>
          <h1>Dice O Rolla</h1>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">Starting engine…</p>
      </header>

      <section class="tray-panel" aria-label="Dice tray">
        <div class="tray" id="tray"></div>
        <output class="result" id="result" aria-live="polite">
          <span class="result-label">Last roll</span>
          <strong>—</strong>
          <span>Choose a die or enter notation.</span>
        </output>
      </section>

      <section class="controls" aria-label="Roll controls">
        <form class="roll-form" id="roll-form">
          <label for="notation">Notation</label>
          <div class="input-row">
            <input
              id="notation"
              name="notation"
              value="2d6"
              maxlength="256"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="notation-help"
            />
            <button class="primary" id="roll" type="submit" disabled>Roll</button>
            <button class="secondary" id="clear" type="button" disabled>Clear</button>
          </div>
          <small id="notation-help"> Try 4d6kh3, 3d20s{1=-2,17..19=1,20=2}, d%, or d66. </small>
        </form>

        <div class="shortcuts" aria-label="Quick rolls">
          <button type="button" data-notation="d4">d4</button>
          <button type="button" data-notation="d6">d6</button>
          <button type="button" data-notation="d8">d8</button>
          <button type="button" data-notation="d10">d10</button>
          <button type="button" data-notation="d12">d12</button>
          <button type="button" data-notation="d20">d20</button>
          <button type="button" data-notation="d%">d%</button>
          <button type="button" data-notation="d100">d100</button>
          <button type="button" data-notation="d66">d66</button>
          <button type="button" data-notation="4d6kh3">4d6 kh3</button>
          <button type="button" data-notation="3d20s{1=-2,17..19=1,20=2}">d20 score</button>
        </div>

        <div class="settings">
          <label>
            Surface
            <select id="theme">
              <option value="plastic">Plastic</option>
              <option value="matte">Matte</option>
            </select>
          </label>
          <label>
            Throw
            <select id="preset">
              <option value="classic">Classic</option>
              <option value="calm">Calm</option>
              <option value="lively">Lively</option>
            </select>
          </label>
        </div>
      </section>
    </main>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
